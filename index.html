<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR Lifecycle Management — פרוטוטייפ</title>
<style>
  :root{
    --ink:#1F1B18; --soft:#3A3430; --muted:#7E756C; --faint:#9A9188;
    --line:#EFEAE6; --line2:#E5E0DC; --page:#F4F2F0; --card:#fff;
    --orange:#E1502A; --orange-ink:#A8563C; --orange-bg:#FDF0E9; --orange-soft:#FDF7F4;
    --green:#2E7D5B; --green-bg:#E8F3EE; --amber:#B07A12; --amber-bg:#FBF1DE;
    --red:#C0392B; --red-bg:#FBEBE9; --blue:#2F5C97; --blue-bg:#EAF0F8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);font-family:"Assistant","Segoe UI",Arial,sans-serif;font-size:14px;line-height:1.55}
  button{font:inherit;cursor:pointer}
  .app{display:flex;min-height:100vh}
  aside{width:196px;flex:0 0 196px;background:#fff;border-left:.5px solid var(--line2);padding:14px 10px}
  .brand{display:flex;align-items:center;gap:8px;padding:4px 8px 14px}
  .brand i{width:22px;height:22px;border-radius:50%;background:var(--orange);display:block}
  .brand b{font-size:14px;font-weight:600}
  .brand small{display:block;font-size:10px;color:var(--faint);font-weight:400}
  nav button{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:transparent;
             color:var(--soft);text-align:right;padding:9px 10px;border-radius:8px;margin-bottom:2px;font-size:13px}
  nav button:hover{background:var(--page)}
  nav button[aria-current="true"]{background:var(--orange-bg);color:var(--orange-ink);font-weight:600}
  nav .n{font-size:11px;color:var(--faint)}
  nav button[aria-current="true"] .n{color:var(--orange-ink)}
  main{flex:1;padding:18px 20px 40px;min-width:0}
  .top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;gap:12px;flex-wrap:wrap}
  h1{font-size:21px;font-weight:600;margin:0}
  .top p{margin:2px 0 0;font-size:12px;color:var(--muted)}
  .card{background:var(--card);border:.5px solid var(--line2);border-radius:10px}
  .pad{padding:14px}
  h2{font-size:13px;font-weight:600;margin:0 0 10px;color:var(--soft)}
  .grid{display:grid;gap:10px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(138px,1fr))}
  .kpi{background:#fff;border:.5px solid var(--line2);border-radius:10px;padding:11px 12px;text-align:right}
  .kpi b{display:block;font-size:22px;font-weight:600;line-height:1.2}
  .kpi span{font-size:11px;color:var(--muted)}
  .kpi.warn b{color:var(--amber)} .kpi.bad b{color:var(--red)}
  .cols{display:grid;grid-template-columns:1.35fr 1fr;gap:12px;align-items:start}
  @media(max-width:900px){.cols{grid-template-columns:1fr}aside{display:none}}
  table{width:100%;border-collapse:collapse}
  th{font-size:11px;color:var(--faint);font-weight:500;text-align:right;padding:0 8px 7px}
  td{padding:9px 8px;border-top:.5px solid var(--line);font-size:13px;vertical-align:middle}
  tr.click:hover td{background:var(--orange-soft);cursor:pointer}
  .chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px}
  .c-ok{background:var(--green-bg);color:var(--green)} .c-run{background:var(--blue-bg);color:var(--blue)}
  .c-stuck{background:var(--red-bg);color:var(--red)} .c-wait{background:var(--amber-bg);color:var(--amber)}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;min-width:70px}
  .bar i{display:block;height:6px;background:var(--orange);border-radius:6px}
  .funnel div{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12px}
  .funnel span:first-child{width:104px;color:var(--muted)}
  .funnel .fb{height:22px;background:var(--orange-bg);border-radius:5px;display:flex;align-items:center;
              justify-content:flex-start;padding:0 7px;color:var(--orange-ink);font-size:11px}
  .alert{display:flex;gap:9px;padding:9px 0;border-top:.5px solid var(--line);font-size:12.5px}
  .alert:first-of-type{border-top:0}
  .dot{width:7px;height:7px;border-radius:50%;margin-top:6px;flex:0 0 7px}
  .alert small{display:block;color:var(--faint);font-size:11px}
  .qa{display:flex;flex-wrap:wrap;gap:7px}
  .qa button{border:.5px solid var(--line2);background:#fff;border-radius:8px;padding:7px 11px;font-size:12.5px;color:var(--soft)}
  .qa button:hover{border-color:var(--orange);color:var(--orange-ink)}
  .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .tools input,.tools select{border:.5px solid var(--line2);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;background:#fff}
  .tools input{min-width:190px}
  .filters{display:flex;gap:5px}
  .filters button{border:.5px solid var(--line2);background:#fff;border-radius:999px;padding:5px 12px;font-size:12px;color:var(--muted)}
  .filters button[aria-pressed="true"]{background:var(--orange-bg);border-color:var(--orange-bg);color:var(--orange-ink)}
  .primary{margin-inline-start:auto;border:0;background:var(--orange);color:#fff;border-radius:8px;padding:8px 14px;font-size:13px}
  .steps li{list-style:none;display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-top:.5px solid var(--line)}
  .steps{margin:0;padding:0}
  .steps li:first-child{border-top:0}
  .steps input{margin-top:3px;width:15px;height:15px;accent-color:var(--orange)}
  .steps b{display:block;font-size:13px;font-weight:500}
  .steps small{color:var(--faint);font-size:11px}
  .done b{color:var(--faint);text-decoration:line-through}
  .tabs{display:flex;gap:4px;border-bottom:.5px solid var(--line2);margin-bottom:12px;flex-wrap:wrap}
  .tabs button{border:0;background:transparent;padding:8px 11px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent}
  .tabs button[aria-selected="true"]{color:var(--orange-ink);border-bottom-color:var(--orange);font-weight:600}
  .tl{position:relative;padding-inline-start:16px}
  .tl::before{content:"";position:absolute;inset-block:4px;inset-inline-start:4px;width:1.5px;background:var(--line)}
  .tl div{position:relative;padding:0 0 13px}
  .tl div::before{content:"";position:absolute;inset-inline-start:-16px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--orange)}
  .tl b{font-size:13px;font-weight:500;display:block}
  .tl small{color:var(--faint);font-size:11px}
  .snap{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
  .snap div{font-size:13px}.snap span{display:block;font-size:11px;color:var(--faint)}
  .rule{border:.5px solid var(--line2);border-radius:10px;padding:12px;background:#fff;margin-bottom:9px}
  .rule code{background:var(--page);border-radius:5px;padding:2px 6px;font-size:12px;font-family:ui-monospace,monospace}
  .sw{position:relative;width:34px;height:19px;border-radius:999px;background:var(--line2);border:0;flex:0 0 34px}
  .sw[aria-pressed="true"]{background:var(--orange)}
  .sw::after{content:"";position:absolute;top:2px;inset-inline-end:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.15s}
  .sw[aria-pressed="true"]::after{inset-inline-end:17px}
  .phone{max-width:330px;margin:0 auto;border:.5px solid var(--line2);border-radius:14px;overflow:hidden;background:#fff}
  .task{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 13px;border-top:.5px solid var(--line)}
  .task b{font-size:13px;font-weight:500;display:block}
  .task small{font-size:11px;color:var(--faint)}
  .task span.go{font-size:12px;color:var(--orange)}
  .toast{position:fixed;inset-block-end:18px;inset-inline-start:18px;background:var(--ink);color:#fff;
         padding:9px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.2s}
  .toast.on{opacity:1}
  .tree ul{list-style:none;margin:0;padding-inline-start:18px;border-inline-start:.5px solid var(--line)}
  .tree>ul{border:0;padding-inline-start:0}
  .tree li{padding:3px 0}
  .node{display:inline-flex;align-items:center;gap:8px;border:.5px solid var(--line2);border-radius:8px;
        padding:6px 10px;background:#fff;cursor:pointer;font-size:13px}
  .node:hover{border-color:var(--orange)}
  .node small{color:var(--faint);font-size:11px}
  .node b{font-weight:500}
  .crit{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:.5px solid var(--line)}
  .crit select{border:.5px solid var(--line2);border-radius:7px;padding:5px 8px;font:inherit;font-size:12.5px;background:#fff}
  .q{border:.5px solid var(--line2);border-radius:9px;padding:10px 12px;margin-bottom:8px;background:#fff}
  .prof{display:flex;gap:3px;background:var(--page);padding:3px;border-radius:8px}
  .prof button{flex:1;border:0;background:transparent;font:inherit;font-size:11.5px;color:var(--muted);padding:6px 4px;border-radius:6px}
  .prof button[aria-pressed="true"]{background:#fff;color:var(--orange-ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .proflbl{font-size:10px;color:var(--faint);margin:0 2px 4px}
  [hidden]{display:none!important}
  :focus-visible{outline:2px solid var(--orange);outline-offset:2px}
</style>
</head>

let cur = 'dash', openProc = null, lifeTab = 'timeline', onbFilter = 'all';
let profile = 'pub';
const PROFILES = {
  pub: {label:'ציבורי', hide:[], rename:{rec:'גיוס ומכרזים', eval:'הערכת עובדים', tkn:'תקן ומצבה'},
        sub:{rec:'ועדות איתור, מכרז פנימי וחיצוני, פרוטוקולים וכתבי מינוי'},
        note:'פרופיל ציבורי: ועדות איתור, אישור רשות החברות, כתבי מינוי, קידום דרגות, מעבר לקביעות, הסכמים קיבוציים ותקן מחייב.'},
  priv:{label:'פרטי', hide:['tkn'], rename:{rec:'גיוס', eval:'הערכות ויעדים', org:'מבנה ארגוני'},
        sub:{rec:'משרות, מועמדים, ראיונות והצעת עבודה'},
        note:'פרופיל פרטי: הצעת עבודה במקום כתב מינוי, יעדים ובונוסים, גיוס מהיר בלי ועדה, בלי תקן מחייב ובלי דרגות.'}
};
function drawProf(){
  const P = PROFILES[profile];
  document.getElementById('profsw').innerHTML =
    `<div class="proflbl">פרופיל ארגוני</div><div class="prof">
      ${Object.entries(PROFILES).map(([k,v])=>`<button data-p="${k}" aria-pressed="${profile===k}">${v.label}</button>`).join('')}
    </div>`;
  document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
    profile = b.dataset.p;
    if (PROFILES[profile].hide.includes(cur)) cur = 'dash';
    toast('הוחלף לפרופיל ' + PROFILES[profile].label + ' — התפריט והמסכים הותאמו');
    draw();
  });
}

const el = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };
const $ = (s) => document.querySelector(s);
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('on'), 1800); }

function drawNav(){
  const P = PROFILES[profile];
  $('#nav').innerHTML = VIEWS.filter(v => !P.hide.includes(v.id)).map(v =>
    `<button data-v="${v.id}" ${v.id===cur?'aria-current="true"':''}>${P.rename[v.id]||v.label}${v.n?`<span class="n">${v.n()}</span>`:''}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b => b.onclick = () => go(b.dataset.v));
}
function go(id){ cur = id; openProc = null; draw(); }

function draw(){
  const v = VIEWS.find(x => x.id === cur), P = PROFILES[profile];
  $('#v-title').textContent = P.rename[v.id] || v.label;
  $('#v-sub').textContent = (P.sub && P.sub[v.id]) || v.sub;
  $('#v-action').innerHTML = '';
  drawProf(); drawNav();
  ({dash:dash, cand:cands, onb:()=>procList('onboarding'), off:()=>procList('offboarding'), life:life, rec:recruit, eval:evals, srv:surveys, evt:welfare, cod:codes, tkn:headcount, org:orgTree, send:send, flow:flow, port:portal})[cur]();
}

/* ---------------- לוח בקרה ---------------- */
function dash(){
  const kpis = [
    {b:DB.onboarding.length, s:'onboarding פעילים', go:'onb'},
    {b:DB.offboarding.length, s:'offboarding פעילים', go:'off'},
    {b:'248', s:'עובדים פעילים'},
    {b:'9', s:'מסמכים חסרים', c:'warn'},
    {b:'12', s:'הדרכות לא הושלמו', c:'warn'},
    {b:'7', s:'הסמכות פגות תוקף', c:'warn'},
    {b:'15', s:'משימות HR פתוחות'},
    ...(profile === 'pub' ? [{b:'4', s:'ממתינים לקביעות', c:'warn'}] : [{b:'6', s:'יעדים ללא הגדרה', c:'warn'}]),
    {b:'3', s:'עובדים בסיכון compliance', c:'bad'}
  ];
  const funnel = [['Candidate',18],['Onboarding',4],['Active Employee',248],['Internal Transition',6],['Offboarding',2],['Alumni',63]];
  const max = 248;
  const procs = [...DB.onboarding.map(p=>({...p,type:'קליטה',view:'onb'})), ...DB.offboarding.map(p=>({...p,type:'עזיבה',view:'off'}))];

  $('#view').innerHTML = `
    <div class="grid kpis" style="margin-bottom:12px">
      ${kpis.map((k,i)=>`<button class="kpi ${k.c||''}" data-go="${k.go||''}" style="border:.5px solid var(--line2)">
        <b>${k.b}</b><span>${k.s}</span></button>`).join('')}
    </div>
    <div class="cols">
      <div class="card pad">
        <h2>תהליכים פעילים</h2>
        <table><thead><tr><th>עובד</th><th>תהליך</th><th>שלב</th><th>התקדמות</th><th>אחראי</th><th>סטטוס</th></tr></thead><tbody>
        ${procs.map(p=>`<tr class="click" data-p="${p.id}" data-v="${p.view}">
          <td>${p.name}</td><td>${p.type}</td>
          <td style="color:var(--muted);font-size:12px">${(p.view==='onb'?ONB_STEPS:OFF_STEPS)[Math.min(p.done,7)]}</td>
          <td><div class="bar" style="width:84px"><i style="width:${p.done/8*100}%"></i></div></td>
          <td style="font-size:12px">${p.owner}</td>
          <td><span class="chip ${p.done===8?'c-ok':p.stuck?'c-stuck':'c-run'}">${p.done===8?'הושלם':p.stuck?'תקוע':'בתהליך'}</span></td></tr>`).join('')}
        </tbody></table>
        <h2 style="margin-top:18px">Lifecycle Funnel</h2>
        <div class="funnel">${funnel.map(([n,v])=>`<div><span>${n}</span>
          <span class="fb" style="width:${Math.max(9, v/max*100)}%">${v}</span></div>`).join('')}</div>
      </div>
      <div>
        <div class="card pad" style="margin-bottom:12px"><h2>התראות</h2>
          ${DB.alerts.map(a=>`<div class="alert"><span class="dot" style="background:${a.c}"></span>
            <span><b style="font-weight:500">${a.b}</b><small>${a.s}</small></span></div>`).join('')}
        </div>
        <div class="card pad" style="margin-bottom:12px"><h2>פרופיל ארגוני פעיל</h2>
          <p style="font-size:12.5px;color:var(--muted);margin:0">${PROFILES[profile].note}</p>
          <p style="font-size:11.5px;color:var(--faint);margin:8px 0 0">המעבר בין פרופילים הוא קונפיגורציה — מערכים, תהליכים ותבניות מסמכים — ולא פיתוח.</p>
        </div>
        <div class="card pad"><h2>פעולות מהירות</h2><div class="qa">
          ${['פתיחת קליטה','פתיחת עזיבה','שליחת מסמך','שיוך הדרכה','יצירת תהליך','שליחת תזכורת'].map(t=>`<button data-qa="${t}">${t}</button>`).join('')}
        </div></div>
      </div>
    </div>`;
  $('#view').querySelectorAll('[data-go]').forEach(b => b.onclick = () => b.dataset.go && go(b.dataset.go));
  $('#view').querySelectorAll('tr[data-p]').forEach(r => r.onclick = () => { cur = r.dataset.v; openProc = r.dataset.p; draw(); });
  $('#view').querySelectorAll('[data-qa]').forEach(b => b.onclick = () => {
    const t = b.dataset.qa;
    if (t === 'שליחת מסמך' || t === 'שיוך הדרכה' || t === 'שליחת תזכורת') go('send'); else toast('דמו: ' + t);
  });
}

          <td><span class="chip ${x.st==='עובד'?'c-ok':x.st==='לא התייצב'?'c-stuck':x.st==='מועמד'?'c-wait':'c-run'}">${x.st}</span></td></tr>`).join('')

          <select id="f-job" style="width:100%">${[...new Set(JOBS.map(j=>j.title))].concat(['רכז/ת שכר','טכנאי/ת שטח','מפתח/ת']).map(x=>`<option>${x}</option>`).join('')}</select></div>

          <select id="f-un" style="width:100%">${DEPTS.map(x=>`<option>${x}</option>`).join('')}</select></div>
        <div><div style="font-size:11px;color:var(--faint);margin-bottom:4px">מקור המועמדות</div>
          <select id="f-src" style="width:100%">${['מכרז פנימי','מכרז חיצוני','ועדת איתור','חברת גיוס','פנייה ישירה','המלצת עובד'].map(x=>`<option>${x}</option>`).join('')}</select></div>
        <div><div style="font-size:11px;color:var(--faint);margin-bottom:4px">תחילת עבודה צפויה</div>

      </div>
      <div style="margin-top:10px"><div style="font-size:11px;color:var(--faint);margin-bottom:4px">קורות חיים ומסמכים</div>
        <div id="f-dz" style="border:1px dashed #C9BFB8;border-radius:9px;padding:12px;text-align:center;font-size:12.5px;color:var(--faint)">גרירת קובץ לכאן תצרף אותו לתיק המועמד</div></div>
      <div class="counter" style="margin-top:12px"><p>בסטטוס "מועמד" הרשומה אינה צורכת תקן, אינה משודרת לשכר ולנוכחות ואינה מופיעה במצבת העובדים</p></div>

        <button class="primary" id="f-save" style="flex:1">פתיחת רשומה</button>
      </div>`;

    dz.ondrop = ev => { ev.preventDefault(); dz.style.borderColor = ''; toast('הקובץ צורף לתיק המועמד'); };

      const n = document.getElementById('f-n').value.trim(),
            tz = document.getElementById('f-tz').value.trim(),
            ph = document.getElementById('f-ph').value.trim();

      const stv = document.getElementById('f-st').value;
      CANDS.unshift({ n, tz: '0••••••' + tz.slice(-2), job: document.getElementById('f-job').value,

      toast(dup ? 'נמצאה התאמה בת.ז. — יש לבדוק אם מדובר באדם שכבר קיים במערכת' : 'רשומת המועמד/ת נפתחה בסטטוס "מועמד"');
      cands();
    };
    return;
  }
  const i = CST.indexOf(c.st);
  const perm = [
    ['קבלת מסמכים לחתימה', i >= 1], ['חתימה דיגיטלית', i >= 1], ['צריכת תקן', i >= 1],

    </div>
    <h2>מה מותר בסטטוס זה</h2>
    ${perm.map(([t, ok]) => `<div style="display:flex;justify-content:space-between;padding:6px 0;border-top:.5px solid var(--line);font-size:12.5px">
      <span>${t}</span><span class="chip ${ok?'c-ok':'c-stuck'}">${ok?'מותר':'חסום'}</span></div>`).join('')}
    <h2 style="margin-top:16px">מסמכים ${i>=4?'בתיק העובד':'בתיק המועמד'}</h2>
    ${c.docs.length ? c.docs.map(d=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-top:.5px solid var(--line);font-size:12.5px">
        <span>${d.n}</span><span class="chip ${d.s==='נחתם'?'c-ok':d.s.indexOf('נחסם')===0?'c-stuck':'c-wait'}">${d.s}</span></div>`).join('')
      : '<p style="font-size:12.5px;color:var(--faint);margin:0">טרם נשלחו מסמכים. שליחה אפשרית מסטטוס "נבחר" ואילך.</p>'}
    <p style="font-size:11.5px;color:var(--faint);margin:10px 0 0">המועמד נכנס בקישור אישי במסרון עם קוד חד-פעמי לטלפון שברשומה — בלי משתמש בארגון.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
      ${i===0 ? '<button class="primary" id="a1">סימון כנבחר/ת</button>' : ''}
      ${i===1 ? '<button class="primary" id="a2">שליחת מסמכים לחתימה</button>' : ''}
      ${i===2 ? '<button class="primary" id="a3">אישור קליטה — ממתין להתייצבות</button>' : ''}
      ${i===3 ? '<button class="primary" id="a4">הפיכה לעובד/ת</button>' : ''}
      ${i>0 && i<4 ? '<button class="ghost" id="no" style="border:.5px solid var(--line2);background:#fff;border-radius:8px;padding:8px 14px;font-size:13px;color:var(--soft)">לא התייצב/ה</button>' : ''}
      ${i===4 ? '<button class="primary" id="goemp">פתיחת תיק העובד ←</button>' : ''}
    </div>`;
  const on = (id, fn) => { const b = document.getElementById(id); if (b) b.onclick = fn; };
  on('a1', () => { c.st = 'נבחר'; toast('סומן/ה כנבחר/ת · תקן שוריין ביחידת ' + c.unit); cands(); });
  on('a2', () => { c.st = 'חתם';
    c.docs = [{n:'חוזה העסקה', s:'נשלח לחתימה'},{n:'NDA', s:'נשלח לחתימה'},{n:'טופס 101', s:'נחסם עד התייצבות'}];
    toast('מסרון עם קישור אישי נשלח · אימות בקוד חד-פעמי'); cands(); });
  on('a3', () => { c.st = 'ממתין להתייצבות'; toast('ממתין להתייצבות ביום ' + c.start); cands(); });
  on('a4', convert);
  on('no', () => { c.st = 'לא התייצב'; toast('התקן השוחרר · הגישה נחסמה · המסמכים נשמרים לתקופת השימור'); cands(); });
  on('goemp', () => go('life'));
}
function convert(){
  const c = CANDS[openCand];
  c.st = 'עובד';
  c.docs = c.docs.map(d => d.s.indexOf('נחסם') === 0 ? {n:d.n, s:'נפתח למילוי'} : d);
  toast('הפך/ה לעובד/ת · הוקצה מספר עובד · התיק והמסמכים עברו עם החתימות · התקן מאויש · שודר לשכר, לנוכחות ול-AD');
  cands();
}

/* ---------------- קליטה / עזיבה ---------------- */
function procList(kind){
  const steps = kind === 'onboarding' ? ONB_STEPS : OFF_STEPS;
  const list = DB[kind];
  $('#v-action').innerHTML = `<button class="primary">${kind==='onboarding'?'פתיחת תהליך קליטה':'פתיחת תהליך עזיבה'}</button>`;
  $('#v-action').firstElementChild.onclick = () => toast('דמו: טופס פתיחת תהליך');

  const proc = list.find(p => p.id === openProc);
  $('#view').innerHTML = `
    <div class="tools">
      <input placeholder="חיפוש עובד" id="q">
      <div class="filters">${[['all','הכל'],['run','בתהליך'],['stuck','תקוע'],['done','הושלם']]
        .map(([k,l])=>`<button data-f="${k}" aria-pressed="${onbFilter===k}">${l}</button>`).join('')}</div>
    </div>
    <div class="cols">
      <div class="card pad">
        <table><thead><tr><th>עובד</th><th>תפקיד</th><th>תאריך</th><th>התקדמות</th><th>סטטוס</th></tr></thead><tbody id="rows"></tbody></table>
      </div>
      <div class="card pad" id="detail">${proc ? '' : '<h2>פרטי תהליך</h2><p style="color:var(--faint);font-size:12.5px;margin:0">בחר/י תהליך מהרשימה כדי לראות את השלבים, המסמכים והיומן.</p>'}</div>
    </div>`;

  const rows = () => {
    const q = ($('#q').value || '').trim();
    $('#rows').innerHTML = list.filter(p => {
      if (q && !(p.name + p.role + p.dept).includes(q)) return false;
      if (onbFilter === 'done') return p.done === 8;
      if (onbFilter === 'stuck') return p.stuck;
      if (onbFilter === 'run') return p.done < 8 && !p.stuck;
      return true;
    }).map(p => `<tr class="click" data-p="${p.id}" ${p.id===openProc?'style="background:var(--orange-soft)"':''}>
      <td><b style="font-weight:500">${p.name}</b><br><small style="color:var(--faint);font-size:11px">${p.dept}</small></td>
      <td style="font-size:12.5px">${p.role}</td><td style="font-size:12.5px">${p.start}</td>
      <td><div class="bar" style="width:76px"><i style="width:${p.done/8*100}%"></i></div>
          <small style="color:var(--faint);font-size:11px">${p.done} מתוך 8</small></td>
      <td><span class="chip ${p.done===8?'c-ok':p.stuck?'c-stuck':'c-run'}">${p.done===8?'הושלם':p.stuck?'תקוע':'בתהליך'}</span></td></tr>`).join('')
      || '<tr><td colspan="5" style="color:var(--faint);font-size:12.5px">לא נמצאו תהליכים</td></tr>';
    $('#rows').querySelectorAll('tr[data-p]').forEach(r => r.onclick = () => { openProc = r.dataset.p; procList(kind); });
  };
  rows();
  $('#q').oninput = rows;
  $('#view').querySelectorAll('[data-f]').forEach(b => b.onclick = () => { onbFilter = b.dataset.f; procList(kind); });

  if (!proc) return;
  const extra = kind === 'offboarding'
    ? `<div class="snap" style="margin-bottom:12px"><div><span>סיבת עזיבה</span>${proc.reason}</div><div><span>אופן עזיבה</span>${proc.mode}</div></div>` : '';
  $('#detail').innerHTML = `
    <h2>${proc.name} · ${kind==='onboarding'?'קליטה':'עזיבה'}</h2>
    <div class="snap" style="margin-bottom:12px">
      <div><span>תפקיד</span>${proc.role}</div><div><span>מחלקה</span>${proc.dept}</div>
      <div><span>תאריך יעד</span>${proc.start}</div><div><span>אחראי/ת</span>${proc.owner}</div>
    </div>${extra}
    <div class="bar" style="margin-bottom:4px"><i style="width:${proc.done/8*100}%"></i></div>
    <small style="color:var(--faint);font-size:11px">${proc.done} מתוך 8 שלבים הושלמו</small>
    <ul class="steps" style="margin-top:10px">
      ${steps.map((s,i)=>`<li class="${i<proc.done?'done':''}">
        <input type="checkbox" data-s="${i}" ${i<proc.done?'checked':''}>
        <span><b>${s}</b><small>${i<proc.done?'הושלם':(i===proc.done?(proc.stuck?'תקוע — ממתין לעובד':'השלב הנוכחי'):'ממתין')}</small></span></li>`).join('')}
    </ul>
    <h2 style="margin-top:16px">יומן פעולות</h2>
    <div class="tl">${DB.employee.timeline.slice(0,3).map(t=>`<div><b>${t.b}</b><small>${t.t} · ${t.s}</small></div>`).join('')}</div>`;
  $('#detail').querySelectorAll('[data-s]').forEach(c => c.onchange = () => {
    const i = +c.dataset.s;
    proc.done = c.checked ? Math.max(proc.done, i + 1) : Math.min(proc.done, i);
    if (proc.done === 8) proc.stuck = false;
    toast(c.checked ? 'השלב סומן כהושלם' : 'השלב הוחזר לממתין');
    procList(kind);
  });
}

/* ---------------- חיי עובד ---------------- */
function life(){
  const e = DB.employee;
  const tabs = [['timeline','ציר זמן'],['docs','מסמכים וחתימות'],['train','הדרכות'],['assets','ציוד והרשאות'],['car','רכב וניידות'],['hier','היררכיה'],['growth','התפתחות']];
  const tbl = (head, rows) => `<table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`;
  const body = {
    timeline: () => `<div class="tl">${e.timeline.map(t=>`<div><b>${t.b}</b><small>${t.t} · ${t.s}</small></div>`).join('')}</div>`,
    docs: () => docsView(),
    train: () => tbl(['הדרכה','חובה/רשות','סטטוס','ציון','תוקף'], e.trainings.map(t=>`<tr><td>${t.n}</td>
      <td style="font-size:12px;color:var(--muted)">${t.req}</td><td><span class="chip ${t.c}">${t.st}</span></td>
      <td style="font-size:12px">${t.g}</td><td style="font-size:12px">${t.exp}</td></tr>`).join('')),
    assets: () => tbl(['פריט','סטטוס','תאריך'], e.assets.map(a=>`<tr><td>${a.n}</td>
      <td><span class="chip ${a.c}">${a.st}</span></td><td style="font-size:12px">${a.d}</td></tr>`).join('')),
    growth: () => tbl(['אירוע','סטטוס','תאריך'], e.growth.map(g=>`<tr><td>${g.n}</td>
      <td><span class="chip ${g.c}">${g.st}</span></td><td style="font-size:12px">${g.d}</td></tr>`).join('')),
    car: () => {
      const v = e.car, pct = Math.round(v.used / v.quota * 100), over = v.used > v.quota;
      return `<div class="snap" style="margin-bottom:14px">
          <div><span>זכאות רכב עמידר</span><span class="chip ${v.elig?'c-ok':'c-wait'}">${v.elig?'זכאי/ת':'לא זכאי/ת'}</span></div>
          <div><span>דרגת ניידות</span>${v.grade}</div>
          <div><span>סוג רכב</span>${v.kind}</div>
          <div><span>מספר רישוי</span>${v.plate}</div>
          <div><span>דגם</span>${v.model}</div>
          <div><span>מקום חניה מוקצה</span>${v.park}</div>
          <div><span>מנוי כביש אגרה</span><span class="chip ${v.toll?'c-ok':'c-wait'}">${v.toll?'כן':'לא'}</span></div>
        </div>
        <h2>מכסת ק״מ חודשית</h2>
        <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:6px">
          <b style="font-size:26px;font-weight:600;line-height:1;color:${over?'var(--red)':'var(--ink)'}">${v.used.toLocaleString()}</b>
          <span style="font-size:12px;color:var(--muted)">מתוך ${v.quota.toLocaleString()} ק״מ · ${pct}%</span>
        </div>
        <div class="bar" style="margin-bottom:10px"><i style="width:${Math.min(100,pct)}%;background:${over?'var(--red)':'var(--orange)'}"></i></div>
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:14px">
          <input type="number" id="kmadd" placeholder="דיווח ק״מ" style="width:120px;border:.5px solid var(--line2);border-radius:8px;padding:6px 9px;font:inherit;font-size:12.5px">
          <button class="primary" id="kmbtn" style="padding:7px 13px">דיווח נסיעה</button>
        </div>
        <h2>אחזקה וטיפולים</h2>
        ${tbl(['פעולה','מועד'], `<tr><td>טיפול אחרון</td><td style="font-size:12.5px">${v.last}</td></tr>
                                 <tr><td>טיפול הבא</td><td style="font-size:12.5px">${v.next}</td></tr>`)}
        <p style="font-size:11.5px;color:var(--faint);margin:10px 0 0">נתוני הרכב מסונכרנים בממשק דו-כיווני עם מערכת ניהול צי הרכב. חריגה מהמכסה נחסמת ודורשת אישור גורם מורשה.</p>`;
    },
    hier: () => {
      const h = e.hier;
      return `<div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;margin-bottom:16px">
          ${h.path.map((n, i) => `<span style="border:.5px solid var(--line2);border-radius:7px;padding:5px 10px;background:${i===h.path.length-1?'var(--orange-bg)':'#fff'};color:${i===h.path.length-1?'var(--orange-ink)':'var(--soft)'}">${n}</span>
            ${i < h.path.length-1 ? '<span style="color:var(--faint)">←</span>' : ''}`).join('')}
        </div>
        <div class="snap" style="margin-bottom:16px">
          <div><span>מנהל/ת ישיר/ה</span>${h.direct}</div>
          <div><span>מנהל/ת עקיף/ה</span>${h.indirect}</div>
          <div><span>רמה בעץ</span>רמה ${h.path.length} מתוך 5</div>
        </div>
        <h2>כפופים ישירות</h2>
        ${tbl(['עובד/ת','פעולה'], h.reports.map(r=>`<tr><td style="font-size:13px">${r}</td>
          <td><button class="goemp" style="border:.5px solid var(--line2);background:#fff;border-radius:7px;padding:4px 9px;font-size:12px">פתיחת תיק ←</button></td></tr>`).join(''))}
        <p style="font-size:11.5px;color:var(--faint);margin:10px 0 0">אותה היררכיה משמשת את מסלול אישור הדיווחים בנוכחות ואת תחנות ההערכה — מנהל ישיר ואחריו מנהל עקיף.</p>`;
    }
  };
  $('#view').innerHTML = `
    <div class="card pad" style="margin-bottom:12px">
      <div class="snap">
        <div><span>עובד/ת</span><b style="font-weight:600">${e.name}</b></div>
        <div><span>תפקיד</span>${e.role}</div><div><span>מחלקה</span>${e.dept}</div>
        <div><span>מנהל/ת</span>${e.manager}</div><div><span>ותק</span>${e.seniority}</div>
        <div><span>סטטוס</span><span class="chip c-run">${e.status}</span></div>
      </div>
      <div class="grid kpis" style="margin-top:12px">
        <div class="kpi"><b>2</b><span>מסמכים ממתינים</span></div>
        <div class="kpi warn"><b>2</b><span>הדרכות חובה פתוחות</span></div>
        <div class="kpi"><b>3</b><span>פריטי ציוד</span></div>
        <div class="kpi warn"><b>1</b><span>הרשאה ממתינה</span></div>
      </div>
    </div>
    <div class="card pad">
      <div class="tabs">${tabs.map(([k,l])=>`<button data-t="${k}" aria-selected="${lifeTab===k}">${l}</button>`).join('')}</div>
      ${body[lifeTab]()}
    </div>`;
  $('#view').querySelectorAll('[data-t]').forEach(b => b.onclick = () => { lifeTab = b.dataset.t; life(); });
  const kb = document.getElementById('kmbtn');
  if (kb) kb.onclick = () => {
    const v = DB.employee.car, add = +document.getElementById('kmadd').value || 0;
    if (!add) return toast('יש להזין מספר ק״מ');
    if (v.used + add > v.quota) return toast('חריגה ממכסת הק״מ — הדיווח נחסם ודורש אישור גורם מורשה');
    v.used += add; toast('דווחו ' + add + ' ק״מ'); life();
  };
  $('#view').querySelectorAll('.goemp').forEach(b => b.onclick = () => toast('דמו: מעבר לתיק העובד הכפוף'));
}



/* ---------------- מסמכים בתיק העובד ---------------- */
const DOCQ = {q:'', cat:'הכל', st:'הכל', sel:[], open:null};
function docsView(){
  const e = DB.employee;
  const cats = ['הכל', ...new Set(e.docs.map(d => d.cat))];
  const list = e.docs.filter(d => {
    const q = DOCQ.q.trim();
    if (q && !(d.n + ' ' + d.cat + ' ' + d.body + ' ' + d.by).includes(q)) return false;
    if (DOCQ.cat !== 'הכל' && d.cat !== DOCQ.cat) return false;
    if (DOCQ.st === 'ממתינים' && d.c !== 'c-wait') return false;
    if (DOCQ.st === 'חתומים' && d.c !== 'c-ok') return false;
    return true;
  });
  const prev = DOCQ.open ? e.docs.find(d => d.n === DOCQ.open) : null;
  setTimeout(bindDocs, 0);
  return `
    <div class="tools" style="margin-bottom:10px">
      <input id="dq" placeholder="חיפוש בשם, בקטגוריה ובתוכן המסמך" value="${DOCQ.q}" style="min-width:250px">
      <select id="dcat">${cats.map(c=>`<option ${DOCQ.cat===c?'selected':''}>${c}</option>`).join('')}</select>
      <select id="dst">${['הכל','ממתינים','חתומים'].map(c=>`<option ${DOCQ.st===c?'selected':''}>${c}</option>`).join('')}</select>
      <button class="primary" id="dprint" ${DOCQ.sel.length?'':'style="opacity:.5"'}>הדפסת ${DOCQ.sel.length||'כל ה'}מסמכים</button>
    </div>
    <div style="display:grid;grid-template-columns:${prev?'1fr 1fr':'1fr'};gap:12px;align-items:start">
      <div>
        <table><thead><tr><th style="width:26px"></th><th>מסמך</th><th>קטגוריה</th><th>גרסה</th><th>סטטוס</th><th>תאריך</th></tr></thead><tbody>
        ${list.length ? list.map(d => `<tr class="click" data-doc="${d.n}" ${DOCQ.open===d.n?'style="background:var(--orange-soft)"':''}>
            <td style="padding:4px"><input type="checkbox" data-sel="${d.n}" ${DOCQ.sel.includes(d.n)?'checked':''} style="width:14px;height:14px;accent-color:var(--orange)"></td>
            <td><b style="font-weight:500;font-size:13px">${d.n}</b><br><small style="color:var(--faint);font-size:11px">${d.src} · ${d.sz}</small></td>
            <td style="font-size:12px;color:var(--muted)">${d.cat}</td>
            <td style="font-size:12px;color:var(--muted)">${d.v}</td>
            <td><span class="chip ${d.c}">${d.st}</span></td>
            <td style="font-size:12px">${d.d}</td></tr>`).join('')
          : '<tr><td colspan="6" style="color:var(--faint);font-size:12.5px">לא נמצאו מסמכים תואמים</td></tr>'}
        </tbody></table>
        <div id="dz" style="margin-top:10px;border:1px dashed var(--grey-line, #C9BFB8);border-radius:9px;padding:14px;
             text-align:center;font-size:12.5px;color:var(--faint)">גרירת קובץ לכאן תוסיף אותו לתיק העובד</div>
        <p style="font-size:11.5px;color:var(--faint);margin:8px 0 0">${list.length} מתוך ${e.docs.length} מסמכים · אין הגבלה על היקף המסמכים בתיק</p>
      </div>
      ${prev ? `<div class="card pad" style="position:sticky;top:12px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
          <div><h2 style="margin-bottom:3px">${prev.n}</h2>
            <p style="margin:0;font-size:11.5px;color:var(--faint)">${prev.cat} · גרסה ${prev.v} · ${prev.sz}</p></div>
          <button id="dclose" style="border:0;background:transparent;color:var(--faint);font-size:18px;line-height:1">×</button>
        </div>
        <div style="margin-top:10px;background:#fff;border:.5px solid var(--line2);border-radius:8px;padding:14px;
             font-size:12.5px;line-height:1.9;min-height:150px">${prev.body}</div>
        <div class="snap" style="margin-top:12px">
          <div><span>סטטוס</span><span class="chip ${prev.c}">${prev.st}</span></div>
          <div><span>תאריך</span>${prev.d}</div>
          <div><span>נקלט על ידי</span>${prev.by}</div>
        </div>
        <p style="font-size:11.5px;color:var(--faint);margin:10px 0 0">הצפייה מתבצעת בלי לצאת מתיק העובד — סגירה מחזירה לאותו מסך.</p>
      </div>` : ''}
    </div>`;
}
function bindDocs(){
  const q = document.getElementById('dq');
  if (!q) return;
  q.oninput = ev => { DOCQ.q = ev.target.value; life(); setTimeout(() => { const n = document.getElementById('dq'); if (n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 0); };
  document.getElementById('dcat').onchange = ev => { DOCQ.cat = ev.target.value; life(); };
  document.getElementById('dst').onchange  = ev => { DOCQ.st  = ev.target.value; life(); };
  document.querySelectorAll('[data-doc]').forEach(r => r.onclick = ev => {

  });
}

/* ---------------- שליחה וסגמנטציה ---------------- */
const FIRST = ['דנה','יוסי','מאיה','אבי','רונית','עומר','נועה','איתי','שירה','גיא','תמר','אורי','ליאת','רועי','הילה','עמית','מיכל','אסף','ענבל','יובל','שרון','דור','אורית','ניר'];
const LAST  = ['לוי','ברק','כהן','נחום','שמש','דגן','אלון','פרץ','מזרחי','אבידן','גל','רוזן'];
const DEPTS = ['תפעול','פיתוח','שירות','מכירות','כספים'];
const SITES = ['תל אביב','חיפה','באר שבע'];
const ROLES = ['מנהל/ת','טכנאי/ת','מפתח/ת','נהג/ת','רכז/ת'];
const STAT  = ['פעיל','בקליטה','בעזיבה'];
const PEOPLE = Array.from({length:48}, (_,i) => ({
  name: FIRST[i % FIRST.length] + ' ' + LAST[(i*5) % LAST.length],
  dept: DEPTS[i % DEPTS.length],
  site: SITES[(i*2) % SITES.length],
  role: ROLES[(i*3) % ROLES.length],
  status: i % 11 === 0 ? STAT[1] : (i % 17 === 0 ? STAT[2] : STAT[0]),
  noSign: i % 6 === 0,
  noTrain: i % 4 === 0,
  expired: i % 9 === 0
}));

const SEND = {what:'מסמך', item:'נוהל אבטחת מידע v3.0', dept:[], site:[], status:[], dyn:[], channel:'SMS', remind:'כל 3 ימים', sla:'7 ימים', sent:false};
const DYN = [['noSign','עובדים שלא חתמו'],['noTrain','לא השלימו הדרכת חובה'],['expired','הסמכה שפגה תוקף']];

function audience(){
  return PEOPLE.filter(p =>
    (!SEND.dept.length   || SEND.dept.includes(p.dept)) &&
    (!SEND.site.length   || SEND.site.includes(p.site)) &&
    (!SEND.status.length || SEND.status.includes(p.status)) &&
    SEND.dyn.every(k => p[k]));
}
function toggle(arr, v){ const i = arr.indexOf(v); i < 0 ? arr.push(v) : arr.splice(i,1); }

function send(){
  const list = audience();
  const chips = (label, opts, arr) => `<div style="margin-bottom:11px">
      <div style="font-size:11px;color:var(--faint);margin-bottom:5px">${label}</div>
      <div class="filters" style="flex-wrap:wrap">${opts.map(o=>`<button data-k="${arr}" data-v="${o}" aria-pressed="${SEND[arr].includes(o)}">${o}</button>`).join('')}</div>
    </div>`;

  $('#v-action').innerHTML = '';
  $('#view').innerHTML = `
    <div class="cols">
      <div class="card pad">
        <h2>מה שולחים</h2>
        <div class="tools" style="margin-bottom:14px">
          <select id="what">${['מסמך','הדרכה','טופס','תזכורת'].map(o=>`<option ${SEND.what===o?'selected':''}>${o}</option>`).join('')}</select>
          <input id="item" value="${SEND.item}" style="flex:1" aria-label="שם הפריט">
        </div>

        <h2>למי שולחים</h2>
        ${chips('מחלקה', DEPTS, 'dept')}
        ${chips('אתר', SITES, 'site')}
        ${chips('סטטוס עובד', STAT, 'status')}
        <div style="margin-bottom:4px">
          <div style="font-size:11px;color:var(--faint);margin-bottom:5px">קבוצות דינמיות</div>
          <div class="filters" style="flex-wrap:wrap">${DYN.map(([k,l])=>`<button data-k="dyn" data-v="${k}" aria-pressed="${SEND.dyn.includes(k)}">${l}</button>`).join('')}</div>
        </div>
        <p style="font-size:11.5px;color:var(--faint);margin:9px 0 0">קבוצה דינמית מתעדכנת מעצמה: עובד שיחתום ייצא מהרשימה, ועובד חדש שלא חתם ייכנס אליה.</p>

        <h2 style="margin-top:18px">איך שולחים</h2>
        <div class="tools">
          <select id="ch">${['SMS','WhatsApp','דוא״ל','התראה בפורטל'].map(o=>`<option ${SEND.channel===o?'selected':''}>${o}</option>`).join('')}</select>
          <select id="rm">${['ללא תזכורת','כל 3 ימים','כל שבוע'].map(o=>`<option ${SEND.remind===o?'selected':''}>${o}</option>`).join('')}</select>
          <select id="sla">${['3 ימים','7 ימים','14 ימים'].map(o=>`<option ${SEND.sla===o?'selected':''}>SLA ${o}</option>`).join('')}</select>
        </div>
      </div>

      <div>
        <div class="card pad" style="margin-bottom:12px">
          <h2>נמענים</h2>
          <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:8px">
            <b style="font-size:30px;font-weight:600;line-height:1">${list.length}</b>
            <span style="font-size:12px;color:var(--muted)">מתוך ${PEOPLE.length} עובדים</span>
          </div>
          <div class="bar" style="margin-bottom:12px"><i style="width:${list.length/PEOPLE.length*100}%"></i></div>
          <div style="max-height:186px;overflow:auto;border-top:.5px solid var(--line)">
            ${list.length ? list.map(p=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:.5px solid var(--line);font-size:12.5px">
                <span>${p.name}</span><span style="color:var(--faint);font-size:11px">${p.dept} · ${p.site}</span></div>`).join('')
              : '<p style="font-size:12.5px;color:var(--faint);margin:10px 0">אין עובדים שעונים על כל התנאים.</p>'}
          </div>
          <button class="primary" id="go" style="width:100%;margin-top:12px" ${list.length?'':'disabled style="width:100%;margin-top:12px;opacity:.5;cursor:not-allowed"'}>
            שליחה ל-${list.length} עובדים</button>
          <p style="font-size:11.5px;color:var(--faint);margin:9px 0 0">${SEND.channel} · תזכורת ${SEND.remind} · SLA ${SEND.sla}</p>
        </div>

        <div class="card pad">
          <h2>מה העובד יקבל</h2>
          <div style="border:.5px solid var(--line2);border-radius:9px;padding:10px;background:var(--orange-bg)">
            <div style="font-size:11px;color:var(--orange-ink);margin-bottom:3px">סינאל · הרמוני</div>
            <div style="font-size:12.5px;line-height:1.6">שלום, ${SEND.what === 'הדרכה' ? 'הדרכה' : 'מסמך'} בשם ״${SEND.item}״ ממתין לך. זמן משוער: 3 דקות.</div>
            <div style="margin-top:8px;padding-top:8px;border-top:.5px solid #F2D9CC;font-size:12.5px;color:var(--orange)">פתיחה ←</div>
          </div>
        </div>
      </div>
    </div>`;

  $('#view').querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
    toggle(SEND[b.dataset.k], b.dataset.v); send();
  });
  $('#what').onchange = e => { SEND.what = e.target.value; send(); };
  $('#item').oninput  = e => { SEND.item = e.target.value; };
  $('#ch').onchange   = e => { SEND.channel = e.target.value; send(); };
  $('#rm').onchange   = e => { SEND.remind = e.target.value; send(); };
  $('#sla').onchange  = e => { SEND.sla = e.target.value.replace('SLA ',''); send(); };
  const g = $('#go');
  if (g) g.onclick = () => { if (audience().length) toast('נשלח ל-' + audience().length + ' עובדים · נפתח מעקב סטטוס'); };
}

/* ---------------- מנוע תהליכים ---------------- */
function flow(){
  $('#v-action').innerHTML = '<button class="primary">חוק חדש</button>';
  $('#v-action').firstElementChild.onclick = () => toast('דמו: בונה חוקים — Drag & Drop');
  $('#view').innerHTML = `<div style="max-width:640px">${DB.rules.map((r,i)=>`
    <div class="rule"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
      <div><div style="font-size:12px;color:var(--faint);margin-bottom:3px">כאשר</div>
        <div style="font-size:13.5px;font-weight:500">${r.w}</div>
        <div style="font-size:12px;color:var(--faint);margin:7px 0 3px">אז</div>
        <div style="font-size:13.5px">${r.t}</div>
        <div style="margin-top:8px"><code>SLA: ${r.sla}</code> <code>Escalation: מנהל ישיר</code></div>
      </div>
      <button class="sw" data-r="${i}" aria-pressed="${r.on}" aria-label="הפעלת חוק"></button>
    </div></div>`).join('')}</div>`;
  $('#view').querySelectorAll('[data-r]').forEach(b => b.onclick = () => {
    const r = DB.rules[+b.dataset.r]; r.on = !r.on; toast(r.on ? 'החוק הופעל' : 'החוק הושבת'); flow();
  });
}

/* ---------------- פורטל עובד ---------------- */
function portal(){
  const tasks = [
    {b:'חתימה על NDA', s:'ממתין · 2 דקות', go:'חתימה'},
    {b:'אישור קריאה — נוהל אבטחת מידע', s:'ממתין · 1 דקה', go:'פתיחה'},
    {b:'הדרכת הגנת הפרטיות', s:'בתהליך · 40% הושלמו', go:'המשך'},
    {b:'חוזה העסקה', s:'נחתם 10.06.2026', go:'צפייה'}
  ];
  $('#view').innerHTML = `<div class="phone">
    <div style="background:#F5F3F1;padding:5px 12px;display:flex;justify-content:space-between;font-size:11px;color:#8A8177"><span>9:41</span><span>סינאל</span></div>
    <div style="height:3px;background:#EFE7E2"><i style="display:block;height:3px;width:60%;background:var(--orange)"></i></div>
    <div style="padding:14px">
      <div style="font-size:11px;color:var(--faint)">שלום דנה</div>
      <div style="font-size:19px;font-weight:600;margin-top:2px">המשימות שלי</div>
      <div style="font-size:12.5px;color:var(--muted);margin-top:3px">3 משימות פתוחות · זמן משוער 5 דק׳</div>
    </div>
    ${tasks.map(t=>`<div class="task"><span><b>${t.b}</b><small>${t.s}</small></span><span class="go">${t.go} ←</span></div>`).join('')}
    <div style="padding:13px;border-top:.5px solid var(--line);font-size:12px;color:var(--faint);text-align:center">ציר הזמן האישי שלי</div>
  </div>`;
  $('#view').querySelectorAll('.task').forEach(t => t.onclick = () => toast('דמו: מעבר למשימה'));
}

draw();
</script>
</body>
</html>
